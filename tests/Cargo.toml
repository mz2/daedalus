[package]
name = "daedalus-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Contract + integration test harness for Daedalus (test-first, Principle I)."

[lib]
path = "src/lib.rs"

[dependencies]
daedalus-proto = { workspace = true }
daedalus-backend = { workspace = true }
daedalus-backend-fake = { workspace = true }
daedalus-backend-workshop = { workspace = true }
daedalus-discovery = { workspace = true }
daedalus-zellij = { workspace = true }
daedalus-sdk = { workspace = true }
daedalus-core = { workspace = true }
daedalus-app = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }

# Contract tests (test-first per Constitution Principle I).
[[test]]
name = "contract_backend"
path = "contract/backend.rs"
[[test]]
name = "contract_persistence"
path = "contract/persistence.rs"
[[test]]
name = "contract_app_start"
