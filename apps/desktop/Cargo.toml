[package]
name = "daedalus-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Daedalus native desktop surface (GPUI). The GPUI renderer is behind the `gpui` feature."

[[bin]]
name = "daedalus-desktop"
path = "src/main.rs"

[features]
# The GPUI renderer is a heavy git dependency that needs a GPU/display and per-platform
# validation (research R-UI). It is opt-in so the headless build/test flow stays fast.
default = []
gpui = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:gpui-component",
    "dep:gpui-component-assets",
    "dep:gpui-terminal",
    "dep:portable-pty",
]

[dependencies]
daedalus-proto = { workspace = true }
daedalus-app = { workspace = true }
daedalus-core = { workspace = true }
daedalus-backend = { workspace = true }
daedalus-backend-fake = { workspace = true }
daedalus-backend-workshop = { workspace = true }
daedalus-zellij = { workspace = true }
daedalus-discovery = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The real GPUI framework (Zed's) + the longbridge component library. Pulled only with
# `--features gpui`. gpui/gpui_platform are pinned to the SAME Zed revision gpui-component
# targets so there is a single gpui version. Heavy: needs a GPU/display + system libs.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", optional = true }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", optional = true }

# Embedded terminal: a GPUI terminal view (built on alacritty_terminal). Our fork carries a
# 2-line adaptation to the gpui revision gpui-component pins. Paired with a PTY.
gpui-terminal = { git = "https://github.com/mz2/gpui-terminal.git", branch = "daedalus", optional = true }
portable-pty = { version = "0.9", optional = true }

# The platform launcher (`application()`); platform features are target-specific.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", optional = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", optional = true, features = ["font-kit"] }

[dev-dependencies]
tokio = { workspace = true }
daedalus-tests = { path = "../../tests" }
