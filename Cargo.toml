[workspace]
resolver = "2"
members = [
    "crates/daedalus-proto",
    "crates/daedalus-backend",
    "crates/daedalus-backend-workshop",
    "crates/daedalus-backend-openshell",
    "crates/daedalus-backend-fake",
    "crates/daedalus-discovery",
    "crates/daedalus-zellij",
    "crates/daedalus-sdk",
    "crates/daedalus-core",
    "crates/daedalus-app",
    "apps/desktop",
    "tests",
]

# The GPUI desktop surface is a heavy git dependency that needs a GPU/display and
# per-platform validation (research.md R-UI). It is built explicitly, not as part of the
# default headless `cargo build`/`cargo test` flow, so CI and local TDD stay fast and green.
default-members = [
    "crates/daedalus-proto",
    "crates/daedalus-backend",
    "crates/daedalus-backend-workshop",
    "crates/daedalus-backend-openshell",
    "crates/daedalus-backend-fake",
    "crates/daedalus-discovery",
    "crates/daedalus-zellij",
    "crates/daedalus-sdk",
    "crates/daedalus-core",
    "crates/daedalus-app",
    "apps/desktop",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-only"
repository = "https://github.com/mz2/daedalus"

[workspace.dependencies]
# Internal crates
daedalus-proto = { path = "crates/daedalus-proto" }
daedalus-backend = { path = "crates/daedalus-backend" }
daedalus-backend-workshop = { path = "crates/daedalus-backend-workshop" }
daedalus-backend-openshell = { path = "crates/daedalus-backend-openshell" }
daedalus-backend-fake = { path = "crates/daedalus-backend-fake" }
daedalus-discovery = { path = "crates/daedalus-discovery" }
daedalus-zellij = { path = "crates/daedalus-zellij" }
daedalus-sdk = { path = "crates/daedalus-sdk" }
daedalus-core = { path = "crates/daedalus-core" }
daedalus-app = { path = "crates/daedalus-app" }

# External — pinned. The async runtime + serde contract layer underpin every crate.
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
async-trait = "0.1.86"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
uuid = { version = "1.12", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.11"
mdns-sd = "0.13"
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.15"

[profile.dev]
# Keep the large dependency graph snappy to iterate on.
opt-level = 0
